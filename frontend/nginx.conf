worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    server {
        listen 5173;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/locations.conf;
    }

    # Optional HTTPS listener for mic/voice input over a LAN IP. Empty by default;
    # setup.sh's HTTPS prompt (or ENABLE_TLS=1) bind-mounts a real server{} block here.
    include /etc/nginx/conf.d/tls-server.conf;
}
