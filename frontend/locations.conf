# Shared between the plain-HTTP and optional-TLS server blocks so both proxy identically.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
}

# Agent chat — SSE streaming, extended timeout (must precede location /api/)
location /api/v1/vto/agent/chat {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vto_api http://vto-api:8088;
    proxy_pass $vto_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

# VTO REST API
location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vto_api http://vto-api:8088;
    proxy_pass $vto_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}

# WebSocket overlay/recommendation streams
location /ws/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vto_api http://vto-api:8088;
    proxy_pass $vto_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
}

# OpenClaw agent gateway (OpenAI-compatible, SSE streaming)
location /openclaw/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $openclaw_backend http://openclaw:5789;
    proxy_pass $openclaw_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
}

# Fashion pipeline API
location ^~ /pipeline/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pipeline_backend http://pipeline:8080;
    rewrite ^/pipeline/(.*)$ /$1 break;
    proxy_pass $pipeline_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
}

# Demo videos and generated assets served from mounted output volume
location ^~ /output/ {
    alias /usr/share/nginx/output/;
    expires 1h;
    add_header Cache-Control "public";
    access_log off;
}

# Store customer demo videos
location ^~ /demo-videos/ {
    alias /usr/share/nginx/demo-videos/;
    expires 1h;
    add_header Cache-Control "public";
    access_log off;
}

# Prometheus metrics proxy
location ^~ /prometheus/ {
    proxy_pass http://prometheus:9090/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Garment images served from mounted data volume
location ^~ /images/ {
    alias /usr/share/nginx/output/;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

# Static asset caching (immutable hashed files)
location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|mp4|webp|webm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# SPA fallback — must be last
location / {
    try_files $uri $uri/ /index.html;
}

error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}
