worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Sniffs the first bytes of each connection on the single exposed port to
# tell a TLS handshake from plain HTTP, then forwards the raw bytes to
# whichever internal, loopback-only server actually speaks that protocol.
# This is what lets http:// and https:// share one port instead of needing
# a second one — mic/voice input just needs the https:// scheme on the same
# address the app is already reached at.
stream {
    map $ssl_preread_protocol $frontend_backend {
        default https_backend;
        ""      http_backend;
    }

    upstream http_backend {
        server 127.0.0.1:8080;
    }

    upstream https_backend {
        server 127.0.0.1:8443;
    }

    server {
        listen 5173;
        ssl_preread on;
        proxy_pass $frontend_backend;
    }
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Reached only via the stream proxy above (plain-HTTP branch), never exposed directly.
    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/locations.conf;
    }

    # Reached only via the stream proxy above (TLS branch), never exposed directly.
    server {
        listen 127.0.0.1:8443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        include /etc/nginx/locations.conf;
    }
}
