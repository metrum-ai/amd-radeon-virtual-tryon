global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "amd-device-metrics"
    static_configs:
      - targets: ["amd-device-metrics-exporter:5000"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ollama"
    static_configs:
      - targets: ["ollama-metrics:8080"]

  - job_name: "vto-api"
    metrics_path: "/metrics/"
    static_configs:
      - targets: ["vto-api:8088"]
